[build]
  base = "apps/desktop"
  command = "pnpm run build:web"

[build.environment]
  NODE_VERSION = "20.12.0"

[context.production.environment]
  VITE_API_URL = "https://popfunssr.netlify.app"  # 确保与部署域名同源
  VITE_FIREBASE_CONFIG = "your-firebase-config-json"  # 替换为实际 Firebase 配置

[[redirects]]
from = "/api/*"
to = "https://popfunssr.netlify.app/api/:splat"
status = 200
force = true