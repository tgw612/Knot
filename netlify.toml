[build]
  base = "apps/ssr"
  publish = "dist/client"
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "20.12.0"

# 静态资源重定向
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# 所有其他请求转发到SSR函数
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index"
  status = 200