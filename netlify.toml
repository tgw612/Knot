[build]
  base = "apps/ssr"
  publish = "dist/client"
  command = "pnpm build"

[build.environment]
  VITE_API_URL = "https://popfunssr.netlify.app"  # 确保与部署域名一致
  # 请在Netlify控制台设置VITE_FIREBASE_CONFIG环境变量

# API请求转发到后端服务
[[redirects]]
  from = "/api/*"
  to = "https://your-api-service.com/:splat"  # 替换为实际API服务地址
  status = 200
  force = true
# 静态资源重定向
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# 所有其他请求转发到SSR函数
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index"
  status = 200