[build]
  base = "apps/desktop"
  publish = "out/web"
  command = "pnpm run build:web"

[build.environment]
  NODE_VERSION = "20.12.0"

[context.production.environment]
  VITE_API_URL = "https://api.popfunssr.netlify.app"  # 确保与部署域名同源
  VITE_FIREBASE_CONFIG = "your-firebase-config-json"  # 替换为实际 Firebase 配置
